name: CI

on:
    pull_request:
    push:
        branches:
            - develop

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - name: Install poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: "poetry"

            - name: Install dependencies
              run: poetry install

            - name: Run tests
              run: poetry run pytest
